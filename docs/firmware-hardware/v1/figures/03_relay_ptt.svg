<text x="45" y="652" font-family="Arial,sans-serif" font-size="13" fill="#9a4d22">FW failsafe: AUTO_PTT_EN OFF at boot, reset, record, stop, and fault. Manual PTT sense is relay-state dependent.</text></svg>
